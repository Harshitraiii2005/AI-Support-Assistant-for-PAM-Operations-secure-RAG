[project]
name = "pam-copilot"
version = "0.1.0"
description = "Secure, locally hosted RAG assistant for first-level Privileged Access Management support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "llama-index-core>=0.12",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.10.4",
    "pypdf>=6.21.4",
    "pyyaml>=6.0",
    "qdrant-client>=1.20.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pam-loggen = "pam_copilot.loggen:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pam_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
